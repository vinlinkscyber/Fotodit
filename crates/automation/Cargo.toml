[package]
name = "fotodit-automation"
description = "MCP server (rmcp) over the Fotodit engine, plus a bridge to a running GUI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
gpu = [
    "dep:fotodit-gpu",
    "dep:wgpu",
    "dep:pollster",
    "fotodit-gpu/native",
]

[lints]
workspace = true

[dependencies]
fotodit-doc = { workspace = true }
fotodit-raster = { workspace = true }
fotodit-compose = { workspace = true }
fotodit-codecs = { workspace = true }
fotodit-io = { workspace = true }
fotodit-format = { path = "../format" }
fotodit-keystore = { workspace = true }
fotodit-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "io-util", "time"] }
base64 = "0.23"
schemars = "1"
getrandom = { workspace = true }
cap-std = "4"
clap = { workspace = true }
log = "0.4"

# Optional native GPU rendering backend
fotodit-gpu = { workspace = true, optional = true }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"], optional = true }
pollster = { version = "1", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
fotodit-color = { workspace = true }
fotodit-geom = { workspace = true }
# Synthetic camera raws (#7789).
fotodit-raw = { workspace = true, features = ["testgen"] }
# Tiny generated PSDs and the scoped estimate charge for the high-memory approval tests
# (no multi-gigabyte fixture or global override).
fotodit-io = { workspace = true, features = ["testgen"] }
fotodit-psd = { workspace = true, features = ["testgen"] }
rmcp = { version = "3.5", default-features = false, features = ["client", "server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "io-util", "time"] }

# Reading back an extended attribute the write path should have preserved (#7095).
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
