[package]
name = "fotodit-cli"
description = "Headless Fotodit: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = ["gpu"]
# Open HEIC/HEIF photos (the optional fotodit-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["fotodit-codecs/heif"]
# Optional native GPU rendering backend, enabled by default in native CLI builds.
gpu = ["fotodit-automation/gpu"]

[lints]
workspace = true

[lib]
name = "fotodit_cli"
path = "src/lib.rs"

[[bin]]
name = "fotodit-cli"
path = "src/main.rs"

[[example]]
name = "gpu_bench"
required-features = ["gpu"]

[dependencies]
fotodit-automation = { path = "../../crates/automation" }
fotodit-doc = { workspace = true }
fotodit-engine = { workspace = true }
fotodit-io = { workspace = true }
fotodit-raster = { workspace = true }
fotodit-format = { path = "../../crates/format" }
fotodit-codecs = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
serde = { workspace = true }
tempfile = "3"
# Synthetic camera raws (#7789).
fotodit-raw = { workspace = true, features = ["testgen"] }
# Shell completions and man pages (examples/man-and-completions.rs, for the packages); not in
# the binary.
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
# The PSD write recipe runner (tests/it/psd_write_oracle.rs).
xtask = { path = "../../xtask" }

[build-dependencies]
# Icon + VERSIONINFO for fotodit-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

