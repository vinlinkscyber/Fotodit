name: screenshot-linux

# Captures the GUI on a headless Linux display so the app's look can be reviewed
# without a local machine. Manual trigger only. Re-run for the navy-glass panel and theme build.
on:
  workflow_dispatch:
  push:
    branches: [chore/optimization-efficiency]
    paths: [.github/workflows/screenshot-linux.yml]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  shot:
    name: GUI screenshots (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install display and capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick x11-apps xdotool \
            libxkbcommon-x11-0 libxcb-xkb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcursor-dev \
            libxi-dev libxrandr-dev libasound2-dev libudev-dev libgl1-mesa-dev
      - name: Build GUI
        run: cargo build --locked -p fotodit
      - name: Launch and capture
        run: |
          export WGPU_BACKEND=gl
          convert -size 1200x800 gradient:steelblue-firebrick -colors 32 /tmp/sample.png
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            FOTODIT_ASSISTANT_DEMO=1 ./target/debug/fotodit /tmp/sample.png &
            APP=$!
            sleep 30
            import -window root /tmp/fotodit-1.png
            xdotool search --name Fotodit windowactivate --sync || true
            xdotool mousemove --sync 655 687 click 1
            sleep 4
            import -window root /tmp/fotodit-2.png
            sleep 2
            import -window root /tmp/fotodit-3.png
            kill $APP || true
          '
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            FOTODIT_ASSISTANT_DEMO=1 ./target/debug/fotodit &
            APP=$!
            sleep 30
            import -window root /tmp/fotodit-home-1.png
            sleep 3
            import -window root /tmp/fotodit-home-2.png
            kill $APP || true
          '
      - uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: /tmp/fotodit-*.png
          retention-days: 14
