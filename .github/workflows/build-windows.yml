name: build-windows

# Unsigned Windows x64 build of the desktop app and CLI for testing. Runs on pushes to this
# branch and on demand; signing and full packaging stay with the release workflow.
on:
  push:
    branches: [chore/optimization-efficiency]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: fotodit (windows-latest, x64)
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Credential-free build: no repository secrets are mapped into the build
      # environment. Provider keys are supplied at runtime by the person running
      # the app (environment variable or .env / fotodit.env / ai_keys.env next to
      # the exe); provider planning stays opt-in via FOTODIT_AI_PROVIDER=provider
      # and the deterministic planner is the default either way.
      - name: Build
        run: cargo build --release --locked -p fotodit -p fotodit-cli
      - name: Artifact sizes
        shell: bash
        run: ls -l target/release/fotodit.exe target/release/fotodit-cli.exe
      - name: Smoke test the CLI
        shell: bash
        run: |
          set -e
          cd "$RUNNER_TEMP"
          B64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
          printf %s "$B64" | base64 -d > smoke.png
          "$GITHUB_WORKSPACE/target/release/fotodit-cli.exe" convert smoke.png smoke.plyra
          "$GITHUB_WORKSPACE/target/release/fotodit-cli.exe" info smoke.plyra
          "$GITHUB_WORKSPACE/target/release/fotodit-cli.exe" convert smoke.plyra smoke-back.png
          ls -l smoke.png smoke.plyra smoke-back.png
      - uses: actions/upload-artifact@v4
        with:
          name: fotodit-windows-x64
          path: |
            target/release/fotodit.exe
            target/release/fotodit-cli.exe
          retention-days: 14
