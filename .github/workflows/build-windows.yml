name: build-windows

# Unsigned Windows x64 build of the desktop app and CLI for testing. Runs on pushes to this
# branch and on demand; signing and full packaging stay with the release workflow.
on:
  push:
    branches: [chore/optimization-efficiency]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: fotodit (windows-latest, x64)
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p fotodit -p fotodit-cli
      - name: Artifact sizes
        shell: bash
        run: ls -l target/release/fotodit.exe target/release/fotodit-cli.exe
      - name: Smoke test the CLI
        shell: bash
        run: |
          set -e
          cd "$RUNNER_TEMP"
          B64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
          printf %s "$B64" | base64 -d > smoke.png
          "$GITHUB_WORKSPACE/target/release/fotodit-cli.exe" convert smoke.png smoke.plyra
          "$GITHUB_WORKSPACE/target/release/fotodit-cli.exe" info smoke.plyra
          "$GITHUB_WORKSPACE/target/release/fotodit-cli.exe" convert smoke.plyra smoke-back.png
          ls -l smoke.png smoke.plyra smoke-back.png
      - name: Write runtime env config
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          LAJIWA_API_KEY: ${{ secrets.LAJIWA_API_KEY }}
        run: |
          set -e
          umask 077
          {
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'OPENROUTER_ENABLED=0\n'
            printf 'COHERE_API_KEY=%s\n' "$COHERE_API_KEY"
            printf 'POLLINATIONS_API_KEY=%s\n' "$POLLINATIONS_API_KEY"
            printf 'LAJIWA_API_KEY=%s\n' "$LAJIWA_API_KEY"
          } > target/release/.env
          awk -F= 'NF>1 && length($2)>0 {n++} END {print n" env entries written"; exit !(n==5)}' target/release/.env
      - uses: actions/upload-artifact@v4
        with:
          name: fotodit-windows-x64
          path: |
            target/release/fotodit.exe
            target/release/fotodit-cli.exe
            target/release/.env
          retention-days: 14
