name: Focused provider contract and portable Windows build

# COMBINED VERIFICATION CANDIDATE r6 for scratch branch qual/verify-r6 (reviewer-prepared,
# unexecuted). This file replaces .github/workflows/build-windows.yml ONLY on the scratch
# branch so it stays dispatchable (workflow_dispatch requires the same workflow path on the
# default branch; main is never touched). Changes vs the r5 candidate (run 45061554996,
# green, editor-only zip 61.2MB delivered; user found Edit > AI Providers greyed):
#   1. Branch guard retargeted to refs/heads/qual/verify-r6; fresh tag qual-candidate-r6
#      (r5 is burned; never retag).
#   2. Menu availability fix: crates/ui-egui/src/menus/state.rs lists edit.aiProviders
#      among the always-available shell commands. Root cause of the greyed menu: it fell
#      through to the engine command registry, which does not know this UI-only command.
#   3. New regressions inside ai_providers_ui::tests (menu enabled + invocation with and
#      without a document, and a real pointer click through the menu harness). They run
#      inside the existing "Provider settings lifecycle tests" step - no workflow change
#      needed for them.
#   4. New rendered harness crates/ui-egui/examples/ai_providers_menu_verify.rs: clicks
#      Edit > AI Providers through the real menu, asserts the window and its key field
#      are in the rendered accessibility tree, and writes PNG evidence of the enabled
#      menu row and the open settings window. The r5 lesson: assert the rendered result,
#      not a state flag.
#   5. Chat presentation (user feedback on the r5 build): the assistant chat spoke in
#      evaluator/pixel-digest machinery and repeated verification disclaimers. Replies
#      are now natural progress or simple failure ("Asking Gemini to plan the edit...",
#      "Done: <title> (3 steps). Tell me if you want anything changed."). Claims state
#      what was DONE, never that the result looks right or was quality-verified;
#      offline stays labelled offline and provider runs name the provider. Evaluator
#      verdicts, pixel observations and provider request counts move to the
#      diagnostic log; the local enhance plan template now speaks in user terms.
# Tag, draft release and dispatch still require owner approval; nothing here publishes.

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: 'Attach the build to a DRAFT release (unmetered storage) only after owner approval; requires the pre-created tag; never publishes'
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  FOTODIT_NO_PRINT: '1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  PLYRA_FONTS_DIR: ${{ github.workspace }}/craft-fonts
  PLYRA_FONTS_REQUIRED: '1'

jobs:
  release:
    name: Verify tag and create the draft release
    if: github.repository == 'vinlinkscyber/Fotodit' && github.ref == 'refs/heads/qual/verify-r6'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents:write lets the run's ephemeral GITHUB_TOKEN create the draft release and,
    # in the other jobs, attach assets. Every other step needs read only.
    permissions:
      contents: write
    steps:
      - name: Confirm public standard-runner scope and no configured provider credentials
        shell: pwsh
        run: |
          if ('${{ github.event.repository.private }}' -ne 'false') { throw 'Public repository required' }
          foreach ($name in @('GEMINI_API_KEY','COHERE_API_KEY','LAJIWA_API_KEY','OPENROUTER_API_KEY','POLLINATIONS_API_KEY','FOTODIT_AI_PROVIDER')) {
            if (Test-Path "Env:$name") { throw "Unexpected configured provider variable: $name" }
          }
      # The pre-created neutral tag must name THIS exact commit before anything expensive
      # or any write happens. Fail safely on lookup error, annotated-tag type mismatch,
      # or commit mismatch; this is a read-only check.
      - name: Verify the pre-created tag matches the dispatched commit
        if: inputs.draft_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = gh api repos/vinlinkscyber/Fotodit/git/refs/tags/qual-candidate-r6
          if ($LASTEXITCODE -ne 0) { throw "tag lookup failed (gh exit $LASTEXITCODE); tag qual-candidate-r6 must be pre-created before dispatch" }
          $ref = $out | ConvertFrom-Json
          if ($ref.object.type -ne 'commit') { throw "tag qual-candidate-r6 must be lightweight (point directly at a commit), got $($ref.object.type)" }
          if ($ref.object.sha -ne $env:GITHUB_SHA) { throw "tag qual-candidate-r6 points at $($ref.object.sha), not the dispatched commit $env:GITHUB_SHA" }
      # Draft release assets are unmetered storage (release quotas: 2 GiB per file, no
      # total-size or bandwidth limit), unlike Actions artifact storage. Drafts are
      # visible and downloadable only to people with write access to this repository.
      # The tag is pre-created at the exact qualification tip with the authorized PAT
      # route after owner approval: the run's GITHUB_TOKEN may not create refs on
      # commits that change workflows, so this step only ever verifies and reuses it.
      # Created FIRST and empty so both build jobs can attach their evidence; a build
      # failure still leaves a draft carrying whatever evidence exists, never a publish.
      - name: Create the empty draft release (never publishes)
        if: inputs.draft_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create qual-candidate-r6 --draft --verify-tag --repo vinlinkscyber/Fotodit --title "Qualification build (draft) - run $env:GITHUB_RUN_ID" --notes 'Unsigned portable Windows x64 test build plus rendered toolbar verification evidence for the qualification candidate. Draft only: never publish. Visible and downloadable only to people with write access to this repository. SHA256SUMS.txt inside the zip verifies every packaged file.'
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }

  focused:
    name: Focused tests and portable Windows build
    needs: release
    if: github.repository == 'vinlinkscyber/Fotodit' && github.ref == 'refs/heads/qual/verify-r6'
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the already-pinned shared font input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Confirm public standard-runner scope and no configured provider credentials
        run: |
          if ('${{ github.event.repository.private }}' -ne 'false') { throw 'Public repository required' }
          foreach ($name in @('GEMINI_API_KEY','COHERE_API_KEY','LAJIWA_API_KEY','OPENROUTER_API_KEY','POLLINATIONS_API_KEY','FOTODIT_AI_PROVIDER')) {
            if (Test-Path "Env:$name") { throw "Unexpected configured provider variable: $name" }
          }
          curl.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'curl is required by current provider transport' }
          git rev-parse HEAD
      - name: Provider settings lifecycle tests
        run: |
          cargo test --locked -p fotodit-ui-egui --lib ai_providers_ui::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provider transport and planning contract mock tests
        run: |
          cargo test --locked -p fotodit-automation --lib ai::provider_bridge::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Intra-plan reference execution regressions (automation)
        run: |
          cargo test --locked -p fotodit-automation --lib ai::tests::intra_plan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Goal-session creation regressions (automation integration)
        run: |
          cargo test --locked -p fotodit-automation --test ai_goal_session
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Engine active-layer visibility runtime check
        run: |
          cargo test --locked -p fotodit-engine --test layer_visibility_active
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Composer host and existing offline regression tests
        run: |
          cargo test --locked -p fotodit --bin fotodit assistant::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable binaries only after all focused tests pass
        run: |
          cargo build --release --locked -p fotodit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The CLI stays CPU-only: its gpu feature is an optional native rendering
          # backend, and the GPU stack belongs to the app exe. The CLI is the qualified
          # build/test tool (the roundtrip below validates rendering correctness on the
          # CPU path); it is built here but not shipped - the editor package carries
          # fotodit.exe only.
          cargo build --release --locked -p fotodit-cli --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: CLI PNG roundtrip and bounded portable payload
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE 'target/release/fotodit.exe'
          $cli = Join-Path $env:GITHUB_WORKSPACE 'target/release/fotodit-cli.exe'
          $stage = Join-Path $env:RUNNER_TEMP 'fotodit-portable'
          $smoke = Join-Path $env:RUNNER_TEMP 'fotodit-smoke'
          New-Item -ItemType Directory -Path $stage,$smoke | Out-Null
          Set-Location $smoke
          # 2x2 opaque pixels, four distinct colors: the pixel check below catches decode,
          # stride, flip and encode regressions, not just a missing output file.
          [IO.File]::WriteAllBytes((Join-Path $smoke 'smoke.png'), [Convert]::FromBase64String('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVR42mP4z8DwHwyBNBAw/AcAR8oI+FuapL4AAAAASUVORK5CYII='))
          & $cli convert smoke.png smoke.plyra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli info smoke.plyra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli convert smoke.plyra smoke-back.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path smoke-back.png)) { throw 'Roundtrip output missing' }
          # Rendering correctness: the round-tripped pixels must match the source colors
          # (opaque, so premultiplied-alpha ambiguity cannot false-fail a correct engine).
          # A 1-channel-least-bit tolerance absorbs encode gamma rounding; a flip, stride or
          # decode regression moves a whole different color into the pixel and fails loudly.
          Add-Type -AssemblyName System.Drawing
          $bmp = [System.Drawing.Bitmap]::FromFile((Join-Path $smoke 'smoke-back.png'))
          try {
            if ($bmp.Width -ne 2 -or $bmp.Height -ne 2) { throw "Roundtrip output is $($bmp.Width)x$($bmp.Height), expected 2x2" }
            $expected = @(@(255,0,0), @(0,255,0), @(0,0,255), @(255,255,0))
            for ($y = 0; $y -lt 2; $y++) {
              for ($x = 0; $x -lt 2; $x++) {
                $px = $bmp.GetPixel($x, $y)
                $want = $expected[$y * 2 + $x]
                if ([Math]::Abs($px.R - $want[0]) -gt 1 -or [Math]::Abs($px.G - $want[1]) -gt 1 -or [Math]::Abs($px.B - $want[2]) -gt 1 -or $px.A -ne 255) {
                  throw "Roundtrip pixel ($x,$y) is $($px.R),$($px.G),$($px.B),$($px.A), expected $($want -join ','),255"
                }
              }
            }
          } finally { $bmp.Dispose() }
          # Editor-only package: no GUI code path spawns or loads the CLI, so it does
          # not ship in the user-facing zip. It remains the build/test tool above.
          Copy-Item $app -Destination $stage
          # Third-party notices and license texts must travel with the binaries when the tree carries them.
          $notices = Join-Path $env:GITHUB_WORKSPACE 'THIRD_PARTY_NOTICES.md'
          if (Test-Path $notices) { Copy-Item $notices -Destination $stage }
          $licenses = Join-Path $env:GITHUB_WORKSPACE 'licenses'
          if (Test-Path $licenses) { Copy-Item $licenses -Destination $stage -Recurse }
          $readme = @'
          Fotodit portable Windows x64 test build. Unsigned, no installer.
          Contains fotodit.exe only (the editor). No provider keys or local credentials.
          Requires Windows graphics support and system curl.exe for provider requests.
          Provider editing is session-only, explicitly enabled in AI providers after adding your own key.
          Requests may consume provider quota or money. The build does not verify your provider plan is free.
          Supported provider mode is bounded single-turn metadata-based command planning, not general image understanding.
          Focused mocked tests and a CLI roundtrip are not Windows GUI, real-photo quality or live-provider acceptance.
          Whole-workspace Clippy/full CI and device acceptance remain outstanding.
          '@
          Set-Content -Path (Join-Path $stage 'README.txt') -Value $readme -Encoding utf8
          # Standard hash-first lowercase checksum lines with forward-slash relative paths,
          # recursing so nested notices/licenses are hashed; then measure the final stage so
          # the cap covers every uploaded byte, manifest included.
          Get-ChildItem $stage -File -Recurse | ForEach-Object {
            $rel = $_.FullName.Substring($stage.Length + 1) -replace '\\','/'
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$rel
          } | Set-Content (Join-Path $stage 'SHA256SUMS.txt')
          $files = Get-ChildItem $stage -File -Recurse
          $total = ($files | Measure-Object Length -Sum).Sum
          # Report the composition BEFORE the cap check so an over-cap run still says what grew,
          # and keep the same table in a file so it can travel to the draft release as evidence.
          $report = Join-Path $env:RUNNER_TEMP 'fotodit-size-report.txt'
          $files | ForEach-Object { '{0} {1} bytes' -f $_.FullName.Substring($stage.Length + 1),$_.Length } | Tee-Object -FilePath $report
          "Portable payload bytes: $total" | Tee-Object -FilePath $report -Append
          if ($total -gt 190MB) { throw 'Portable payload exceeds 190MiB raw cap (well under the 2 GiB release-asset limit)' }
      - name: Zip the portable stage and enforce the asset size limit
        if: inputs.draft_release == true
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'fotodit-portable'
          $zip = Join-Path $env:RUNNER_TEMP 'fotodit-portable-windows-x64.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal -ErrorAction Stop
          $bytes = (Get-Item $zip).Length
          Write-Output "Release asset bytes: $bytes"
          if ($bytes -ge 2147483648) { throw 'Release asset must stay under the 2 GiB per-file limit' }
      # Failure-state evidence: the size table attaches even when the cap above threw.
      - name: Attach the size report to the draft release (success or failure)
        if: inputs.draft_release == true && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'fotodit-size-report.txt'
          if (Test-Path $report) {
            gh release upload qual-candidate-r6 $report --clobber --repo vinlinkscyber/Fotodit
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
          } else {
            Write-Output 'No size report produced (a step before packaging failed); run log is the evidence.'
          }
      - name: Attach the portable zip to the draft release (never publishes)
        if: inputs.draft_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'fotodit-portable-windows-x64.zip'
          gh release upload qual-candidate-r6 $zip --clobber --repo vinlinkscyber/Fotodit
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }

  linux-render:
    name: Rendered toolbar verification (ubuntu-latest)
    needs: release
    if: github.repository == 'vinlinkscyber/Fotodit' && github.ref == 'refs/heads/qual/verify-r6'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the already-pinned shared font input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Confirm public standard-runner scope and no configured provider credentials
        run: |
          set -e
          if [ '${{ github.event.repository.private }}' != 'false' ]; then echo 'Public repository required'; exit 1; fi
          for name in GEMINI_API_KEY COHERE_API_KEY LAJIWA_API_KEY OPENROUTER_API_KEY POLLINATIONS_API_KEY FOTODIT_AI_PROVIDER; do
            if [ -n "$(printenv "$name" || true)" ]; then echo "Unexpected configured provider variable: $name"; exit 1; fi
          done
      # Same native dependency set the repo's screenshot-linux.yml proves for GUI builds,
      # plus the software Vulkan stack (lavapipe) the kittest wgpu renderer needs headless.
      - name: Install native build and software-Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick x11-apps xdotool \
            libxkbcommon-x11-0 libxcb-xkb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcursor-dev \
            libxi-dev libxrandr-dev libasound2-dev libudev-dev libgl1-mesa-dev \
            mesa-vulkan-drivers vulkan-tools
      - name: Confirm software Vulkan (lavapipe) is available
        run: vulkaninfo --summary | head -40
      - name: Confirm the verification harnesses are present on this branch
        run: |
          test -f crates/ui-egui/examples/assistant_reopen_verify.rs
          test -f crates/ui-egui/examples/ai_providers_menu_verify.rs
      - name: Toolbar compact visual regression tests
        run: |
          set -o pipefail
          cargo test --locked -p fotodit-ui-egui --lib panels::compact_visual_regressions 2>&1 | tee regressions.txt
      # kittest renders offscreen through wgpu; no X server is needed. lavapipe provides
      # the Vulkan device. The harness asserts the badge is fully inside the viewport at
      # 700px and 360px in open and closed rail states, asserts the panels.assistant round
      # trip, then writes four rendered PNGs under /tmp/verify-snaps as *.new.png
      # (kittest's no-reference-snapshot naming) and fails if any render or write fails.
      - name: Rendered assistant-badge verification harness
        env:
          WGPU_BACKEND: vulkan
        run: |
          set -o pipefail
          cargo run --locked -p fotodit-ui-egui --example assistant_reopen_verify 2>&1 | tee reopen-verify.txt
      # The r5 regression proof: a real pointer click on Edit > AI Providers must open
      # the key window; PNG evidence of the enabled menu row and the open window.
      - name: Rendered provider-menu verification harness
        env:
          WGPU_BACKEND: vulkan
        run: |
          set -o pipefail
          cargo run --locked -p fotodit-ui-egui --example ai_providers_menu_verify 2>&1 | tee providers-verify.txt
      - name: List rendered evidence
        if: always()
        run: ls -la /tmp/verify-snaps/ || true
      - name: Attach rendered evidence and logs to the draft release (success or failure)
        if: inputs.draft_release == true && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=()
          [ -f regressions.txt ] && files+=(regressions.txt)
          [ -f reopen-verify.txt ] && files+=(reopen-verify.txt)
          [ -f providers-verify.txt ] && files+=(providers-verify.txt)
          for f in /tmp/verify-snaps/*.new.png; do
            [ -e "$f" ] && files+=("$f")
          done
          if [ ${#files[@]} -eq 0 ]; then echo 'No evidence files produced; run log is the evidence.'; exit 0; fi
          if ! gh release upload qual-candidate-r6 "${files[@]}" --clobber --repo vinlinkscyber/Fotodit; then echo 'gh release upload failed'; exit 1; fi
